# 重力补偿配置 —— tools/gravity_comp.py 专用
#
#   τ_motor = dir × g(q) × gains[J] × scale
#   MIT 帧:  p_des = 当前角(或 --hold 锁存角), v_des = 0, kp[J], kd[J], t_ff = τ_motor
#
# gains / kp / kd 三段都是「每轴一行」，互不影响，改哪个轴只影响那个轴。

common:
  scale: 1.0          # 全局重力补偿总量
  limit: 6.0          # 单轴力矩上限 N·m（必须大于 max|g(q)|，否则削平会下坠）
  ramp: 4.0           # 力矩从 0 渐入的秒数
  rate: 100.0         # 下发频率 Hz
  active: [J0, J1, J2, J3, J4, J5]   # 参与补偿的轴；删掉哪个哪个不使能

# ── 重力补偿系数 ───────────────────────────────
#   某轴「拖动时下坠」→ 加大（1.1 / 1.2 / 1.3 …）
#   某轴「自己往上飘」→ 减小（0.9 / 0.8 …）
gains:
  J0: 1.0
  J1: 1.2
  J2: 1.1
  J3: 1.0
  J4: 1.0
  J5: 1.0

# ── 负角度侧系数（q < 0）─────────────────────
#   没写的轴沿用上面的 gains。
#   用途：某轴正向刚好、反向偏软（或反过来）时，两侧分开调。
#   零点附近 ±0.1 rad（约 5.7°）内线性过渡，不会在 q=0 处跳变。
gains_neg:
 # J1: 1.2

# ── 逐轴角度修正（度）─────────────────────────
#   等价于用 q + phase 去评估重力模型，用来补偿「URDF 质心与实机不符」或「零点差几度」。
#   调法：某侧下坠 → 先加 gain；加 gain 后另一侧开始上飘 → 改 phase 把误差挪回去。
#   符号：负值 = 把模型往负方向挪（会让负角度区补偿变强）
phase_deg:
  J0: 0
  J1: 3
  J2: 0
  J3: 0
  J4: 0
  J5: 0

# ── 位置刚度 N·m/rad ──────────────────────────
#   0    = 不做位置控制（零重力示教，推哪停哪）
#   3~10 = 松手会回到 p_des
kp:
  J0: 0.0
  J1: 0.0
  J2: 0.0
  J3: 0.0
  J4: 0.0
  J5: 0.0

# ── 阻尼 N·m/(rad/s) ─────────────────────────
#   0    = 无阻尼（会缓慢漂）
#   0.5~1.5 = 能刹住，拖动手感适中
kd:
  J0: 0.0
  J1: 0.0
  J2: 0.0
  J3: 0.0
  J4: 0.0
  J5: 0.0
