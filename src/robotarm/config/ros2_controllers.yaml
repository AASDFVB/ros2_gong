# ros2_control 控制器配置（真机：达妙 DM4310 / can0；硬件插件在 URDF 的 <ros2_control> 段）
controller_manager:
  ros__parameters:
    # 更新频率的唯一入口：改这里，start.sh / launch 都不覆盖
    update_rate: 200          # Hz，read/write 循环频率

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

arm_controller:
  ros__parameters:
    joints:
      - J0
      - J1
      - J2
      - J3
      - J4
      - J5
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0
