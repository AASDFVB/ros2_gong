# 位置伺服配置 —— tools/joint_servo.py 专用
#
#   τ = kp[J]·(q_cmd − q) + kd[J]·(0 − q̇) + dir·g(q)·gains[J]
#
# 和大臂重力补偿（gravity_comp.yaml）分开，互不影响。

common:
  limit: 6.0          # 单轴力矩上限 N·m
  ramp: 4.0           # 力矩渐入秒数
  rate: 100.0         # 控制频率 Hz
  max_deg_s: 30.0     # 目标限速（度/秒），拖滑条再快手臂也匀速走

# ── 重力补偿系数 ───────────────────────────────
gains:
  J0: 1.0
  J1: 1.3
  J2: 1.0
  J3: 1.0
  J4: 1.0
  J5: 1.0

# ── 位置刚度 N·m/rad ──────────────────────────
#   伺服必须有刚度，否则不跟目标。
#   大关节（J0~J2）惯量大，需要更大 kp 才稳；
#   腕部（J3~J5）轻，kp 小一点避免抖动。
kp:
  J0: 2.0
  J1: 2.0
  J2: 2.0
  J3: 2.0
  J4: 2.0
  J5: 2.0

# ── 阻尼 N·m/(rad/s) ─────────────────────────
#   太小会超调/抖动，太大拖起来发沉
kd:
  J0: 0.05
  J1: 0.05
  J2: 0.05
  J3: 0.05
  J4: 0.05
  J5: 0.05
